<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大雁塔 - 珍宝集</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background-color: #121212; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; user-select: none; }
        
        /* 顶部标题 */
        #header {
            position: absolute; top: 0; width: 100%; height: 70px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            text-align: center; color: #d4a017; z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: center;
        }
        h1 { margin: 0; font-size: 22px; letter-spacing: 3px; font-weight: normal; }
        .subtitle { font-size: 12px; color: #888; margin-top: 4px; }

        /* --- 底部主导航 (固定常驻) --- */
        #bottom-nav {
            position: absolute; bottom: 0; width: 100%; height: 60px;
            background: #1a1a1a; border-top: 1px solid #333;
            display: flex; justify-content: space-around; align-items: center;
            z-index: 100;
        }
        .nav-item {
            color: #555; cursor: pointer; text-align: center; flex: 1; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: all 0.3s;
        }
        .nav-item.active { color: #d4a017; background: rgba(255, 255, 255, 0.05); }
        .nav-item i { font-size: 18px; margin-bottom: 4px; }
        .nav-item span { font-size: 11px; }

        /* --- 模式 1：门票 UI --- */
        #ticket-ui {
            position: absolute; bottom: 70px; width: 100%; 
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            z-index: 10; transition: opacity 0.3s;
        }
        .season-dots { display: flex; gap: 15px; margin-bottom: 5px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #444; cursor: pointer; border: 2px solid transparent; transition: all 0.3s; }
        .dot.active { transform: scale(1.5); border-color: #fff; background: #d4a017 !important; }

        .ticket-actions { display: flex; gap: 15px; pointer-events: auto; }
        .btn {
            background: rgba(30,30,30,0.8); border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 10px 25px; border-radius: 30px; backdrop-filter: blur(5px);
            cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 14px;
        }
        .btn-primary { 
            background: linear-gradient(135deg, #b8860b, #daa520); 
            border: none; color: #111; font-weight: bold; 
            box-shadow: 0 4px 15px rgba(184, 134, 11, 0.3);
        }

        /* 左右切换箭头 */
        .arrow-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 50px; height: 80px; background: transparent;
            color: rgba(255,255,255,0.4); border: none; font-size: 40px; cursor: pointer;
            z-index: 25; display: flex; align-items: center; justify-content: center;
            transition: 0.3s;
        }
        .arrow-btn:hover { color: #d4a017; scale: 1.1; text-shadow: 0 0 10px #d4a017; }
        .arrow-left { left: 10px; }
        .arrow-right { right: 10px; }

        /* --- 模式 2：文物图鉴 UI --- */
        #collection-ui {
            position: absolute; top: 70px; bottom: 60px; width: 100%;
            background: rgba(18, 18, 18, 0.98); z-index: 15; display: none;
            flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box;
            overflow-y: auto;
        }
        
        .stats-bar {
            width: 100%; max-width: 600px; display: flex; justify-content: space-between;
            color: #888; font-size: 12px; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px;
        }

        .grid-container {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 12px; width: 100%; max-width: 600px;
        }
        
        .artifact-card {
            background: #222; border: 1px solid #333; border-radius: 6px;
            padding: 15px 5px; text-align: center; cursor: pointer; transition: 0.2s;
        }
        .artifact-card.unlocked { border-color: #d4a017; background: #2a2000; }
        .artifact-card.unlocked i { color: #d4a017; }
        .artifact-card.unlocked .artifact-name { color: #fff; }
        .artifact-card.locked { opacity: 0.6; filter: grayscale(100%); }
        .artifact-card.locked i { color: #666; }

        /* 修改：调整图标样式以支持图片 */
        .artifact-icon { width: 50px; height: 50px; object-fit: contain; margin: 0 auto 10px auto; display: block; }
        
        .artifact-name { font-size: 11px; color: #888; }
        
        /* 文物详情浮层 */
        #detail-overlay {
            position: absolute; top: 80px; width: 100%; text-align: center;
            z-index: 12; display: none; pointer-events: none;
        }
        .detail-box {
            background: rgba(0,0,0,0.8); display: inline-block; padding: 15px 25px;
            border-radius: 8px; border: 1px solid #444; backdrop-filter: blur(5px);
            max-width: 80%; pointer-events: auto;
        }
        .detail-title { color: #d4a017; font-size: 18px; margin-bottom: 5px; font-weight: bold; }
        .detail-desc { color: #ccc; font-size: 13px; line-height: 1.4; }
        .locked-tip { color: #ff5252; font-size: 12px; margin-top: 5px; font-style: italic; display: none; }

        /* 关闭详情按钮 */
        #close-detail-btn {
            margin-top: 15px; padding: 5px 15px; background: rgba(255,255,255,0.1); 
            border: 1px solid #555; color: #aaa; border-radius: 20px; font-size: 12px; cursor: pointer;
        }
        #close-detail-btn:hover { background: #333; color: white; }

        /* --- 抽奖遮罩 --- */
        #loot-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 100; display: none;
            flex-direction: column; justify-content: center; align-items: center;
        }
        .reel-container {
            width: 100%; max-width: 600px; height: 160px; background: #111;
            border-top: 1px solid #d4a017; border-bottom: 1px solid #d4a017;
            position: relative; overflow: hidden;
        }
        .winning-line {
            position: absolute; left: 50%; top: 0; bottom: 0; width: 2px;
            background: #ff0000; transform: translateX(-50%); z-index: 20;
            box-shadow: 0 0 15px rgba(255,0,0,0.8);
        }
        .reel-track {
            display: flex; height: 100%; align-items: center; position: absolute; left: 0;
        }
        .item-card {
            box-sizing: border-box; width: 140px; height: 140px; margin: 0 5px;
            background: #1a1a1a; border: 1px solid #444; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: #fff; flex-shrink: 0;
        }
        #win-modal { opacity: 0; transition: opacity 0.5s; text-align: center; margin-top: 20px; color: #d4a017; }

    </style>
</head>
<body>

    <div id="header">
        <h1>大雁塔</h1>
        <div class="subtitle">慈恩寺 · 历史文化珍藏</div>
    </div>

    <!-- 3D 画布 -->
    <div id="canvas-container"></div>

    <!-- 左右切换箭头 (仅在门票模式显示) -->
    <div class="arrow-btn arrow-left" id="arrow-left" onclick="changeTicket(-1)">&#10094;</div>
    <div class="arrow-btn arrow-right" id="arrow-right" onclick="changeTicket(1)">&#10095;</div>

    <!-- 文物详情浮层 -->
    <div id="detail-overlay">
        <div class="detail-box">
            <div class="detail-title" id="d-title">文物名称</div>
            <div class="detail-desc" id="d-desc">文物介绍文案</div>
            <div class="locked-tip" id="d-lock"><i class="fas fa-lock"></i> 暂未获得 3D模型不可见</div>
            <button id="close-detail-btn" onclick="closeArtifactDetail()">返回图鉴</button>
        </div>
    </div>

    <!-- 模式 1：门票操作 -->
    <div id="ticket-ui">
        <div class="season-dots">
            <div class="dot active" onclick="loadTicket(0)"></div>
            <div class="dot" onclick="loadTicket(1)"></div>
            <div class="dot" onclick="loadTicket(2)"></div>
            <div class="dot" onclick="loadTicket(3)"></div>
        </div>
        <div class="ticket-actions">
            <button class="btn" onclick="flipTicket()"><i class="fas fa-sync-alt"></i> 翻转</button>
            <button class="btn btn-primary" id="btn-open-box" onclick="checkOrOpenBox()">
                <i class="fas fa-box-open"></i> 开启盲盒
            </button>
        </div>
    </div>

    <!-- 模式 2：图鉴列表 -->
    <div id="collection-ui">
        <div class="stats-bar">
            <span>历史文物图鉴</span>
            <span id="collection-count">收集进度: 0/6</span>
        </div>
        <div id="artifact-grid" class="grid-container">
            <!-- 动态生成 -->
        </div>
    </div>

    <!-- 底部导航 (始终显示) -->
    <div id="bottom-nav">
        <div class="nav-item active" id="nav-ticket" onclick="setMode('ticket')">
            <i class="fas fa-ticket-alt"></i>
            <span>门票</span>
        </div>
        <div class="nav-item" id="nav-collection" onclick="setMode('collection')">
            <i class="fas fa-book"></i>
            <span>图鉴</span>
        </div>
    </div>

    <!-- 抽奖遮罩 -->
    <div id="loot-overlay">
        <div class="reel-container">
            <div class="winning-line"></div>
            <div class="reel-track" id="reel-track"></div>
        </div>
        <div id="win-modal">
            <h2 id="win-title"></h2>
            <p>已点亮图鉴</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>

    <script>
        // --- 1. 数据配置 ---
        // 修改：将 icon 改为 images 文件夹下的图片路径
        // 请确保你的 images 文件夹中有对应的图片文件，或者修改这里的文件名
        const artifactPool = [
            { id: "p1", name: "《大唐西域记》", icon: "images/book.png", type: "book", desc: "玄奘口述，记录亲历110国及传闻28国的山川风俗。" },
            { id: "p2", name: "玄奘负笈像", icon: "images/statue.png", type: "statue", desc: "玄奘法师身背经箧，手持拂尘，长途跋涉取经归来的经典形象。" },
            { id: "p3", name: "真身舍利", icon: "images/orb.png", type: "orb", desc: "大雁塔地宫供奉的珍贵佛舍利，见证千年佛法传承。" },
            { id: "p4", name: "石门楣线刻画", icon: "images/plaque.png", type: "plaque", desc: "塔底门楣上的唐代线刻画，线条流畅，艺术价值极高。" },
            { id: "p5", name: "贝叶经", icon: "images/leaf.png", type: "leaf", desc: "古印度用贝多罗叶刻写的佛经，玄奘法师从天竺带回。" },
            { id: "p6", name: "大慈恩寺匾额", icon: "images/flat.png", type: "flat", desc: "标志着这座皇家寺院辉煌历史的匾额。" }
        ];

        // 修改：将门票图片改为 images 文件夹下的路径
        const tickets = [
            { front: "images/spring_front.png", back: "images/spring_back.png", opened: false },
            { front: "images/summer_front.png", back: "images/summer_back.png", opened: false },
            { front: "images/autumn_front.png", back: "images/autumn_back.png", opened: false },
            { front: "images/winter_front.png", back: "images/winter_back.png", opened: false }
        ];

        let unlockedIds = []; 
        let currentMode = 'ticket';
        let currentTicketIndex = 0;
        let scene, camera, renderer, controls, activeObject;

        // --- 2. 初始化 ---
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x121212);
            
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 0, 8);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);
            const spot = new THREE.SpotLight(0xffffff, 1);
            spot.position.set(5, 10, 5);
            scene.add(spot);

            loadTicketModel(0);
            renderCollectionGrid();
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // --- 3. 模式切换逻辑 ---
        function setMode(mode) {
            currentMode = mode;
            
            // 底部导航高亮
            document.getElementById('nav-ticket').className = mode === 'ticket' ? 'nav-item active' : 'nav-item';
            document.getElementById('nav-collection').className = mode === 'collection' ? 'nav-item active' : 'nav-item';

            const ticketUI = document.getElementById('ticket-ui');
            const collectionUI = document.getElementById('collection-ui');
            const detailOverlay = document.getElementById('detail-overlay');
            const leftArrow = document.getElementById('arrow-left');
            const rightArrow = document.getElementById('arrow-right');

            if (mode === 'ticket') {
                ticketUI.style.display = 'flex';
                collectionUI.style.display = 'none';
                detailOverlay.style.display = 'none';
                // 显示箭头
                leftArrow.style.display = 'flex';
                rightArrow.style.display = 'flex';
                
                loadTicketModel(currentTicketIndex); // 恢复 3D 门票
            } else {
                ticketUI.style.display = 'none';
                collectionUI.style.display = 'flex';
                detailOverlay.style.display = 'none';
                // 隐藏箭头
                leftArrow.style.display = 'none';
                rightArrow.style.display = 'none';
                
                if (activeObject) scene.remove(activeObject);
                renderCollectionGrid();
            }
        }

        // --- 4. 门票逻辑 ---
        function loadTicket(index) {
            currentTicketIndex = index;
            loadTicketModel(index);
        }

        function changeTicket(direction) {
            let newIndex = currentTicketIndex + direction;
            if (newIndex < 0) newIndex = tickets.length - 1;
            if (newIndex >= tickets.length) newIndex = 0;
            loadTicket(newIndex);
        }

        function loadTicketModel(index) {
            document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === index));
            
            if (activeObject) scene.remove(activeObject);
            const data = tickets[index];

            // -------------------------------------------------------------
            // 核心修改：使用 85:54 比例
            // 宽 4.25, 高 2.7, 厚 0.02
            // -------------------------------------------------------------
            const geometry = new THREE.BoxGeometry(4.25, 2.7, 0.02);
            
            const loader = new THREE.TextureLoader();
            const matFront = new THREE.MeshStandardMaterial({ map: loader.load(data.front) });
            const matBack = new THREE.MeshStandardMaterial({ map: loader.load(data.back) });
            const matSide = new THREE.MeshStandardMaterial({ color: 0xcccccc });

            activeObject = new THREE.Mesh(geometry, [matSide, matSide, matSide, matSide, matFront, matBack]);
            activeObject.rotation.y = -0.3;
            scene.add(activeObject);

            const btn = document.getElementById('btn-open-box');
            if (data.opened) {
                btn.innerHTML = '<i class="fas fa-check"></i> 已开启';
                btn.style.background = "#444";
            } else {
                btn.innerHTML = '<i class="fas fa-box-open"></i> 开启盲盒';
                btn.style.background = "linear-gradient(135deg, #b8860b, #daa520)";
            }
            
            gsap.from(activeObject.scale, {x:0, y:0, z:0, duration: 0.4});
        }

        function flipTicket() {
            if (activeObject) {
                gsap.to(activeObject.rotation, { y: activeObject.rotation.y + Math.PI, duration: 0.6 });
            }
        }

        // --- 5. 抽奖逻辑 ---
        function checkOrOpenBox() {
            const data = tickets[currentTicketIndex];
            if (data.opened) {
                setMode('collection'); 
            } else {
                startLottery();
            }
        }

        function startLottery() {
            const overlay = document.getElementById('loot-overlay');
            const track = document.getElementById('reel-track');
            const winModal = document.getElementById('win-modal');
            const data = tickets[currentTicketIndex];

            document.getElementById('arrow-left').style.display = 'none';
            document.getElementById('arrow-right').style.display = 'none';

            const winner = artifactPool[Math.floor(Math.random() * artifactPool.length)];
            
            track.innerHTML = '';
            track.style.transition = 'none';
            track.style.transform = 'translateX(0)';
            
            const targetIdx = 40;
            const CARD_W = 150;
            
            for(let i=0; i<50; i++) {
                let item = (i === targetIdx) ? winner : artifactPool[Math.floor(Math.random() * artifactPool.length)];
                let div = document.createElement('div');
                div.className = "item-card";
                // 修改：抽奖转盘中使用 img 标签显示图片
                div.innerHTML = `<img src="${item.icon}" style="width:60px; height:60px; object-fit:contain; margin-bottom:10px;">
                                 <div style="font-size:12px; margin-top:5px; color:#aaa">${item.name}</div>`;
                track.appendChild(div);
            }

            overlay.style.display = 'flex';
            winModal.style.opacity = 0;

            const containerCenter = window.innerWidth > 600 ? 300 : window.innerWidth / 2;
            const targetCenterX = targetIdx * CARD_W + 75;
            const moveX = targetCenterX - containerCenter;

            track.offsetHeight;

            setTimeout(() => {
                track.style.transition = 'transform 5s cubic-bezier(0.1, 0.9, 0.15, 1)';
                track.style.transform = `translateX(-${moveX}px)`;
            }, 50);

            setTimeout(() => {
                data.opened = true;
                if (!unlockedIds.includes(winner.id)) {
                    unlockedIds.push(winner.id);
                }

                document.getElementById('win-title').innerText = winner.name;
                winModal.style.opacity = 1;

                setTimeout(() => {
                    overlay.style.display = 'none';
                    setMode('collection');
                    showArtifactDetail(winner);
                }, 2000);
            }, 5500);
        }

        // --- 6. 图鉴系统 ---
        function renderCollectionGrid() {
            const grid = document.getElementById('artifact-grid');
            document.getElementById('collection-count').innerText = `收集进度: ${unlockedIds.length}/${artifactPool.length}`;
            grid.innerHTML = '';

            artifactPool.forEach(item => {
                const isUnlocked = unlockedIds.includes(item.id);
                const card = document.createElement('div');
                card.className = isUnlocked ? 'artifact-card unlocked' : 'artifact-card locked';
                
                // 修改：如果已解锁显示图片，未解锁显示问号图标
                const iconHtml = isUnlocked 
                    ? `<img src="${item.icon}" class="artifact-icon">` 
                    : `<i class="artifact-icon fas fa-question-circle" style="font-size:32px; line-height:50px; color:#666;"></i>`;

                card.innerHTML = `
                    ${iconHtml}
                    <div class="artifact-name">${item.name}</div>
                `;
                card.onclick = () => {
                    document.getElementById('collection-ui').style.display = 'none';
                    showArtifactDetail(item);
                };
                grid.appendChild(card);
            });
        }

        function showArtifactDetail(item) {
            const isUnlocked = unlockedIds.includes(item.id);
            const overlay = document.getElementById('detail-overlay');
            
            overlay.style.display = 'block';
            document.getElementById('d-title').innerText = item.name;
            document.getElementById('d-desc').innerText = item.desc;
            document.getElementById('d-lock').style.display = isUnlocked ? 'none' : 'block';

            if (activeObject) scene.remove(activeObject);

            if (isUnlocked) {
                // 显示 3D
                let geometry;
                if (item.type === 'book') geometry = new THREE.BoxGeometry(2, 2.5, 0.4);
                else if (item.type === 'statue') geometry = new THREE.CylinderGeometry(0.5, 0.6, 2.5, 16);
                else if (item.type === 'orb') geometry = new THREE.SphereGeometry(1, 32, 32);
                else if (item.type === 'leaf') geometry = new THREE.BoxGeometry(0.5, 3, 0.02);
                else geometry = new THREE.BoxGeometry(2, 2, 2);

                const material = new THREE.MeshStandardMaterial({ 
                    color: 0xd4a017, roughness: 0.3, metalness: 0.6 
                });
                
                activeObject = new THREE.Mesh(geometry, material);
                scene.add(activeObject);
                gsap.from(activeObject.scale, {x:0, y:0, z:0, duration: 0.8, ease:"elastic.out"});
                gsap.to(activeObject.rotation, {y: Math.PI*2, duration: 15, repeat:-1, ease:"none"});
            }
        }

        // 关闭详情，返回图鉴列表
        window.closeArtifactDetail = function() {
            document.getElementById('detail-overlay').style.display = 'none';
            document.getElementById('collection-ui').style.display = 'flex';
            if (activeObject) scene.remove(activeObject);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
